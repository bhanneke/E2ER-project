{% extends "base.html" %}
{% block title %}New paper — e2er{% endblock %}

{% block content %}
<h1>New paper</h1>

<div hx-get="/htmx/preflight-banner" hx-trigger="load" hx-swap="innerHTML">
  <div class="pf-banner">Checking this machine…</div>
</div>

<form method="post" action="/papers" class="paper-form">
  <label>
    <span>Title</span>
    <input type="text" name="title" required maxlength="200"
           placeholder="e.g. Concentrated liquidity and price discovery on Uniswap v3" />
  </label>

  <label>
    <span>Research question</span>
    <textarea name="research_question" rows="4" required
              placeholder="What is the empirical question this paper answers?"></textarea>
  </label>

  <div class="row">
    <label>
      <span>Mode</span>
      <select name="mode">
        <option value="single_pass" selected>single_pass — one pass, about an hour</option>
        <option value="iterative">iterative — adds self-attack &amp; polish, considerably longer</option>
      </select>
    </label>

    <label>
      <span>Pipeline</span>
      {# Read off the files on disk, not a list in the code: a pipeline dropped
         into ./pipelines or ~/.e2er/pipelines shows up here by itself. #}
      <select name="pipeline">
        {% for p in pipelines %}
          <option value="{{ p.name }}" {% if p.name == 'empirical' %}selected{% endif %}>
            {{ p.name }}{% if p.description %} — {{ p.description }}{% endif %}
          </option>
        {% endfor %}
      </select>
      <small class="muted">
        The sequence of specialists, gates and reviews this paper runs through.
        Each is a file you can copy and change — see <code>pipelines/</code>.
      </small>
    </label>

    <label>
      <span>Methodology</span>
      <select name="methodology">
        <option value="empirical" selected>empirical — data-driven, identification + econometrics</option>
        <option value="theoretical">theoretical — formal model, hypotheses, no data</option>
        <option value="mixed">mixed — formal model AND empirical test</option>
      </select>
    </label>

    <label>
      <span>Cost cap (USD)</span>
      <input type="number" name="max_cost_usd" min="1" max="500" step="1"
             value="{{ default_cap }}" />
    </label>
  </div>

  <button type="submit" class="btn-primary">Start pipeline</button>
</form>
{% endblock %}
