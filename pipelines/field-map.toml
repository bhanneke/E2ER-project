# Map a research field: main path analysis of its citation network.
#
# The workflow follows Michal Hron's article "Map a research field with Claude:
# main path analysis, step by step" (LinkedIn Pulse, 8 October 2026,
# https://www.linkedin.com/pulse/map-research-field-claude-main-path-analysis-step-michal-hron-jm2ge/,
# read on 2026-10-08; shared by Björn Hanneke); this implementation is
# independent and uses OpenAlex. Adopted from the article: the six-step
# workflow (boundary, internal citation network with completeness checks, SPC
# weights, main path and key routes, robustness across journal sets, a map with
# lanes named as questions) and the pitfalls it lists. e2er's own: the code in
# src/modules/fieldmap, the OpenAlex retrieval, the handling of citation
# cycles, the exports, these steps and stops, and the number-checked review.
# Hron's own implementation runs on Scopus (github.com/michalhron/scopus-plus-mcp);
# nothing of it is used here. The methods: Hummon and Doreian (1989), Batagelj
# (2003), Liu and Lu (2012); see [[credit]] below and the skill
# skills/files/synthesis/main-path-analysis.md.
#
# Judgement where judgement is needed, code for everything that is counted:
#
#   design_boundary    the boundary designer proposes search terms (with the
#                      topic's older names), a journal set, years, and 2 to 6
#                      alternative boundaries (field_boundary.json)
#   retrieve_boundary  code retrieves every boundary from OpenAlex (paged,
#                      cached, with a request ceiling); runs at every start, so
#                      an edited boundary is retrieved again
#   review_boundary    the researcher approves or edits the boundaries, seeing
#                      the paper counts
#   citation_network   code builds the network of citations inside the main
#                      boundary and reports what is missing; stops when too many
#                      papers have no internal link or no references
#   main_path          code: SPC weights, the global and local main paths, key
#                      routes, the heaviest links
#   robustness         code: the same on every alternative boundary; which
#                      papers are on every main path
#   propose_lanes      the lane mapper groups the mapped papers into lanes
#                      named as questions, from titles and abstracts
#   review_lanes       the researcher approves or edits the lanes
#   draw_map           code: the map, reading list, Pajek/GEXF/VOSviewer/CSV
#                      exports, tables and field_map_results.json
#   write_review       the review writer drafts a short field review whose
#                      numbers come from field_map_results.json
#   number_check       every table value of the draft traced to the results
#   citation_check     every citation in the bibliography and in an index
#   review_draft       the researcher reads the draft
#
# No estimation, no estimation gate, no econometrics: nothing here is
# estimated. No review panel: the draft is a description of computed results.
#
# Maintained by the e2er contributors.

name = "field-map"
title = "Map a research field"
description = "Map a research field: retrieve its papers from OpenAlex, compute the main path of its citation network (SPC weights, key routes), test it on alternative boundaries, and draw the field by year in lanes named as questions, with a reading list, network exports and a short field review."
methodologies = ["bibliometric", "literature review"]

finalize = ["compile", "audit_export", "github_push", "structured_export"]

