accessed   = "2026-10-08"
found_via  = "shared by Björn Hanneke"
adopted    = "The six-step workflow: a boundary of search terms and journals, the internal citation network with completeness checks, SPC weights, the main path with key routes, robustness across alternative journal sets, and a map with topic lanes named as questions; and the pitfalls the article lists."
own        = "The code (OpenAlex retrieval, network, SPC, main paths, key routes, cycle handling, robustness, exports, map), the template's steps and researcher stops, the specialists' instructions, and the field review whose numbers e2er checks."
statement  = "The workflow follows Michal Hron's article \"Map a research field with Claude: main path analysis, step by step\" (LinkedIn Pulse, 8 October 2026); this implementation is independent and uses OpenAlex."

