[[steps]]
kind  = "researcher"
name  = "review_design"
after = ["idea_developer", "literature_scanner", "data_architect"]
files = ["paper_plan.md", "literature_review.md", "data_dictionary.json"]

# Inside the initial phase, right after the data analyst has loaded the data and
# before the analysis. On a failure the data analyst is sent back once with the
# reasons; if the data still fail, the run stops for the researcher.
[[steps]]
kind    = "gate"
name    = "data_quality_gate"
check   = "data_quality"
after   = ["data_architect", "data_analyst"]
on_fail = "retry"

[steps.settings]
max_missing_share = 0.05

[[steps]]
kind = "strategist"
name = "initial"

[[steps]]
kind  = "strategist"
name  = "iterative"
modes = ["iterative"]

# Not resumable, as in every template: the results must pass their contract
# before anything that depends on them runs.
[[steps]]
kind      = "gate"
name      = "estimation_gate"
check     = "estimation"
on_fail   = "halt"
resumable = false

[[steps]]
kind      = "gate"
name      = "figure_gate"
check     = "figure_data"
on_fail   = "halt"
resumable = false

[[steps]]
kind  = "researcher"
name  = "review_draft"
files = ["paper_draft.tex", "abstract.tex"]

[[steps]]
kind  = "specialists"
name  = "self_attack"
modes = ["iterative"]
run   = ["self_attacker"]

[[steps]]
kind     = "specialists"
name     = "polish"
modes    = ["iterative"]
parallel = true
run      = ["polish_numerics", "polish_bibliography"]

[[steps]]
kind     = "aggregate"
name     = "review"
parallel = true
run = [
    "data_reviewer",
    "methods_reviewer",
    "plausibility_reviewer",
    "literature_reviewer",
    "writing_reviewer",
]

[[steps]]
kind = "specialists"
name = "revision"
run  = ["revisor", "patch_revisor"]

[[steps]]
kind = "specialists"
name = "replication"
run  = ["replication_packager"]
