# A descriptive data study: question and data in, a checked description of the data out.
#
# For studies that describe a sample rather than estimate an effect: what the
# data look like, how values are distributed, how two variables move together,
# and what the data cannot show. Typical of astronomy catalogues, earth-science
# records, official statistics and the first part of most empirical papers.
#
# What the template changes about e2er's economics defaults
# (docs/templates.md, "Results, causal claim, persona, data skills and panel"):
# results are descriptive statistics and distributions (results = "descriptive",
# src/core/pipeline/result_kinds.py), no causal claim and so no identification
# strategy, the researcher persona instead of the economist's, no blockchain
# data skills, a panel of reviewers for any discipline, and polish of the
# numbers and the references only.
#
# Steps:
#   review_design      the researcher reads the plan, the literature and the
#                      declared data before anything is loaded
#   data_quality_gate  after the data analyst, before the analysis: units,
#                      duplicates, missing values and coverage of every
#                      declared table (src/core/pipeline/data_quality.py);
#                      writes data_quality.md
#   estimation_gate    the results file held to the descriptive contract
#   figure_gate        every figure re-read from the data or results it names
#   review_draft       the researcher reads the draft before the reviewers
#
# The method skill is methods/descriptive-analysis; the method sources are the
# [[credit]] entries at the foot of the top-level settings.

name = "descriptive-study"
title = "Descriptive data study"
description = "Question and data in, a checked description of the data out: the sample and its filters, summary statistics, distributions and associations, figures re-read from the data. A data check stops the run on missing units, duplicate rows, unexplained gaps or missing coverage before anything is computed."
methodologies = ["empirical", "descriptive"]

results     = "descriptive"
causal      = false
base_skill  = "base/researcher"
data_skills = []
review_weights = { methods_reviewer = 1.5, data_reviewer = 1.25, plausibility_reviewer = 1.25, literature_reviewer = 0.75, writing_reviewer = 0.75 }

# Teardown, not a step (see empirical.toml). Declared above the first step
# table, because TOML binds a bare key after a table array to that table.
finalize = ["compile", "audit_export", "github_push", "structured_export"]

[skills]
data_architect          = ["methods/descriptive-analysis"]
data_analyst            = ["methods/descriptive-analysis"]
econometrics_specialist = ["methods/descriptive-analysis"]
paper_drafter           = ["methods/descriptive-analysis"]
methods_reviewer        = ["methods/descriptive-analysis"]
data_reviewer           = ["methods/descriptive-analysis"]

