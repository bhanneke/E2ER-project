[[steps]]
kind = "specialists"
name = "design_protocol"
run  = ["protocol_designer"]

[[steps]]
kind      = "gate"
name      = "search"
check     = "meta_search"
# Runs at every start: a protocol the researcher edited is searched again;
# unchanged searches are read from the cache without a request.
resumable = false

[steps.settings]
max_records  = 600
max_requests = 40
max_crossref = 100

[[steps]]
kind  = "researcher"
name  = "review_protocol"
files = ["review_protocol.json", "review_protocol.md", "search_counts.md", "records.csv"]

[[steps]]
kind     = "preregister"
name     = "preregister"
optional = true
files    = ["review_protocol.md", "review_protocol.json", "search_counts.md"]

[[steps]]
kind = "specialists"
name = "screen"
run  = ["study_screener"]

[[steps]]
kind      = "gate"
name      = "screening_check"
check     = "meta_screening"
# Runs again after the researcher edits screening.json.
resumable = false

[steps.settings]
sample_size = 20

[[steps]]
kind  = "researcher"
name  = "review_screening"
files = ["screening.json", "screening_sample.md", "screening.md", "records.csv"]

[[steps]]
kind      = "gate"
name      = "fulltext"
check     = "meta_fulltext"
# Runs at every start: a PDF the researcher saves in data/fulltext/ is read then.
resumable = false

[steps.settings]
max_downloads = 60

[[steps]]
kind = "specialists"
name = "extract"
run  = ["study_extractor"]

[[steps]]
kind      = "gate"
name      = "extraction_check"
check     = "meta_extraction"
resumable = false

[[steps]]
kind     = "researcher"
name     = "review_extraction"
optional = true
files    = ["extraction.json", "extraction_check.md", "extraction.md", "risk_of_bias.csv"]

[[steps]]
kind      = "gate"
name      = "synthesis"
check     = "meta_synthesis"
resumable = false

[[steps]]
kind = "specialists"
name = "write_draft"
run  = ["meta_review_writer"]

[[steps]]
kind  = "researcher"
name  = "review_draft"
files = ["paper_draft.tex", "estimation_results.json"]

[[steps]]
kind     = "specialists"
name     = "polish"
modes    = ["iterative"]
parallel = true
run      = ["polish_numerics", "polish_bibliography"]

[[steps]]
kind     = "aggregate"
name     = "review"
parallel = true
run = [
    "methods_reviewer",
    "data_reviewer",
    "plausibility_reviewer",
    "writing_reviewer",
    "technical_reviewer",
]

[[steps]]
kind = "specialists"
name = "revision"
run  = ["revisor", "patch_revisor"]
