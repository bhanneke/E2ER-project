# Systematic review and meta-analysis: a question in, the studies that answer it found, screened,
# extracted and pooled, and a review whose every number e2er checks.
#
# The workflow follows the PRISMA 2020 statement (Page et al. 2021): a protocol
# fixed before the search, a recorded and repeatable search, screening with a
# reason for every exclusion, eligibility on the full text, extraction with
# risk of bias, a synthesis that reports heterogeneity, and a flow diagram of
# the records. What e2er adds: every extracted number is read back from the
# page and quote the extractor cites, and the meta-analysis is e2er's own code
# (src/modules/metaanalysis/stats.py, checked against metafor's published
# results), written into the study as run_estimation.py so `e2er reproduce`
# reruns it.
#
# Judgement where judgement is needed, code for everything that is counted:
#
#   design_protocol     the protocol designer writes review_protocol.json: the
#                       question (PICO, PECO or another form), eligibility
#                       criteria with ids, databases, searches, outcome, effect
#                       measure, synthesis settings, risk-of-bias tool
#   search              code runs every search on OpenAlex (and Crossref when
#                       named), records the queries, counts and dates, and
#                       removes duplicates (records.json); runs at every start,
#                       so an edited protocol is searched again
#   review_protocol     the researcher approves or edits the protocol, seeing
#                       the counts
#   preregister         OPTIONAL: the protocol frozen with its fingerprint
#   screen              the study screener decides every record on its title
#                       and abstract (include, exclude with criterion and
#                       reason, unsure)
#   screening_check     code: every record decided, every exclusion with a
#                       criterion of the protocol and a reason; the sample for
#                       the researcher (screening_sample.md)
#   review_screening    the researcher reads the unsure records and a sample of
#                       exclusions, and corrects decisions
#   fulltext            code: open-access full texts of the included and
#                       unsure records, page by page, or the reason there is none
#   extract             the study extractor decides eligibility on the full
#                       text and extracts effects, characteristics and risk of
#                       bias, every number with its page and quote
#   extraction_check    code: every extracted number read back from its source
#   review_extraction   OPTIONAL: the researcher reads the extraction table
#   synthesis           code: random-effects meta-analysis (REML or DL), tau^2,
#                       I^2, Q, prediction interval, Egger's test, trim and fill,
#                       leave-one-out; narrative synthesis below min_studies;
#                       forest, funnel and PRISMA flow figures; tables
#   write_draft         the review writer drafts the review from the results
#   review_draft        the researcher reads the draft
#   review              number check, citation check, then the panel
#
# Maintained by the e2er contributors.

name = "systematic-review"
title = "Systematic review and meta-analysis"
description = "A systematic review with a random-effects meta-analysis, following PRISMA 2020: a protocol fixed before the search, a recorded OpenAlex search, screening with a reason for every exclusion, open-access full texts, extraction in which every number is traced to its page and quote, a meta-analysis by e2er's own code (tau^2, I^2, prediction interval, Egger's test, trim and fill, leave-one-out) or a plain narrative synthesis when too few studies can be pooled, and a PRISMA flow diagram."
methodologies = ["systematic review", "meta-analysis"]

results     = "metaanalysis"
causal      = false
base_skill  = "base/researcher"
data_skills = []
review_weights = { methods_reviewer = 1.5, data_reviewer = 1.25, technical_reviewer = 1.0, plausibility_reviewer = 1.0, writing_reviewer = 0.75 }

finalize = ["compile", "audit_export", "github_push", "structured_export"]

[skills]
methods_reviewer      = ["methods/meta-analysis"]
data_reviewer         = ["methods/meta-analysis"]
technical_reviewer    = ["methods/meta-analysis"]
plausibility_reviewer = ["methods/meta-analysis"]
revisor               = ["methods/meta-analysis"]
patch_revisor         = ["methods/meta-analysis"]

