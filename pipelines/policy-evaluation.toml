# Policy evaluation by difference-in-differences.
#
# A policy reached some units (countries, regions, firms) at known dates and not
# others; the study estimates what it changed in an outcome by comparing the
# treated units' change with the change of units not (yet) treated. The design
# carries the study, so it is declared machine-readably and checked twice.
#
#   did_design_gate   before estimation. The identification strategist writes
#                     did_design.json (outcome, panel, treatment timing,
#                     comparison group, estimator; schema in
#                     skills/files/econometrics/did-practice.md). The check reads
#                     the panel in data.db and stops the run when the outcome or
#                     timing is not in the data, when there is no comparison
#                     group, when timing is staggered and the estimator is
#                     two-way fixed effects (it asks for a heterogeneity-robust
#                     estimator), or when no cohort has `min_pre_periods`
#                     periods before treatment.
#                     A failed check sends the identification strategist back
#                     once with the reasons, then stops the run for the researcher.
#   preregister       the design, frozen before any estimation (approve it to
#                     go on; edit it first to change it).
#   did_results_gate  after estimation, before drafting. The results must hold
#                     the event-study path with at least `min_pre_periods`
#                     pre-treatment periods, a joint pre-trends test (a
#                     rejection at `pretrend_alpha` stops the run unless a
#                     Rambachan-Roth sensitivity analysis is reported), a placebo
#                     test or a sensitivity analysis, and the declared estimator
#                     under `main`. The event-study plot is drawn from the
#                     results. A failed check sends the econometrics specialist
#                     back once, then stops the run.
#
# Maintained by the e2er contributors.

name = "policy-evaluation"
title = "Policy evaluation (difference-in-differences)"
description = "What a policy changed, by difference-in-differences: the design (treatment timing, comparison group, estimator) is checked against the data before estimation, and the event study, pre-trends test and placebo or sensitivity analysis after it."
methodologies = ["empirical", "difference-in-differences"]

results     = "regression"
causal      = true
data_skills = []
review_weights = { identification_reviewer = 1.5, data_reviewer = 1.25, methods_reviewer = 1.0, technical_reviewer = 1.0, writing_reviewer = 0.75 }

# Teardown, not a step (see empirical.toml). Declared above the first step
# table, because TOML binds a bare key after a table array to that table.
finalize = ["compile", "audit_export", "github_push", "structured_export"]

# Listed before the pre-registration, so that when both are due the check runs
# first and what is frozen is a design that passed it.
[[steps]]
kind    = "gate"
name    = "did_design_gate"
check   = "did_design"
on_fail = "retry"
after   = ["identification_strategist", "data_architect", "data_analyst"]

[steps.settings]
min_pre_periods = 2

[[steps]]
kind  = "preregister"
name  = "preregister"
after = ["idea_developer", "literature_scanner", "identification_strategist", "data_architect", "data_analyst"]

# Runs as soon as the estimation is done, before anything is drafted around it.
[[steps]]
kind    = "gate"
name    = "did_results_gate"
check   = "did_results"
on_fail = "retry"
after   = ["econometrics_specialist"]

[steps.settings]
min_pre_periods = 2
pretrend_alpha  = 0.05

[[steps]]
kind = "strategist"
name = "initial"

[[steps]]
kind  = "strategist"
name  = "iterative"
modes = ["iterative"]

[[steps]]
kind      = "gate"
name      = "estimation_gate"
check     = "estimation"
on_fail   = "halt"
resumable = false

[[steps]]
kind  = "specialists"
name  = "self_attack"
modes = ["iterative"]
run   = ["self_attacker"]

[[steps]]
kind     = "specialists"
name     = "polish"
modes    = ["iterative"]
parallel = true
run      = ["polish_formula", "polish_numerics", "polish_bibliography"]

[[steps]]
kind     = "aggregate"
name     = "review"
parallel = true
run = [
    "identification_reviewer",
    "data_reviewer",
    "methods_reviewer",
    "writing_reviewer",
    "technical_reviewer",
]

[[steps]]
kind = "specialists"
name = "revision"
run  = ["revisor", "patch_revisor"]

[[steps]]
kind = "specialists"
name = "replication"
run  = ["replication_packager"]

[skills]
identification_strategist = ["econometrics/did-practice"]
econometrics_specialist   = ["econometrics/did-practice"]
identification_reviewer   = ["econometrics/did-practice"]
methods_reviewer          = ["econometrics/did-practice"]

# The machine-readable design the checks read.
[sidecars]
identification_strategist = ["did_design.json"]

