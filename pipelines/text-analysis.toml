# Text analysis: a corpus in, counts, key terms, dictionary measures and topics out.
#
# For studies that count and model language in a corpus of documents: books
# (Project Gutenberg through `e2er-data gutenberg`), speeches, articles,
# abstracts, or the researcher's own texts (.txt, .csv or .jsonl in the data
# folder). Term frequencies and their dispersion, keyness between groups
# (log-likelihood G2 with the log ratio), collocations, dictionary and sentiment
# measures with a hand-checked sample, topic models (LDA or NMF) with their
# stability across seeds, and change over time. No causal claim; the
# researcher persona; no blockchain data skills.
#
# The order of the work and its checks (src/core/pipeline/text_checks.py; the
# method skill is methods/text-analysis):
#   corpus_design_gate     after the data architect: corpus_design.json states
#                          the question, the corpus and how it was sampled, the
#                          metadata with their sources, the preprocessing
#                          (token pattern, lower-casing, stop words, lemmas,
#                          n-grams), the groups, the analyses and the sampling
#                          bias; dictionaries and topic-model seeds are fixed
#                          here, before the analysis
#   review_design          the researcher reads the plan and the corpus design
#                          before the corpus is built
#   corpus_gate            after the data analyst: every document with its
#                          source, licence and SHA-256; token counts and corpus
#                          statistics recomputed with the recorded preprocessing
#   text_results_gate      after the analysis: term counts, keyness (G2, log
#                          ratio), collocations, dictionary hits recounted;
#                          topic models with seeds, k-selection evidence,
#                          stability across seeds recomputed, example documents
#   text_validation_gate   after the text validator: the sample of every
#                          dictionary or sentiment measure, every passage found
#                          in its document and judged, the precision recomputed
#   estimation_gate        the results held to the text results contract
#   figure_gate            every figure re-read from the results it names
#   review_draft           the researcher reads the draft before the reviewers
#
# A failed check inside the dispatch sends its specialist back once with the
# reasons, then stops the run.

name = "text-analysis"
title = "Text analysis"
description = "A corpus in, counts and models of its language out: term frequencies, key terms (log-likelihood with the log ratio), collocations, dictionary and sentiment measures with a hand-checked sample, topic models with their stability across seeds, change over time. The corpus design and preprocessing are fixed before the corpus is built; e2er recounts every number from the corpus."
methodologies = ["empirical", "text analysis"]

results     = "text"
causal      = false
base_skill  = "base/researcher"
data_skills = []
review_weights = { methods_reviewer = 1.5, data_reviewer = 1.25, plausibility_reviewer = 1.0, technical_reviewer = 1.0, writing_reviewer = 0.75 }

finalize = ["compile", "audit_export", "github_push", "structured_export"]

[skills]
data_architect          = ["methods/text-analysis"]
data_analyst            = ["methods/text-analysis"]
econometrics_specialist = ["methods/text-analysis"]
paper_drafter           = ["methods/text-analysis"]
methods_reviewer        = ["methods/text-analysis"]
technical_reviewer      = ["methods/text-analysis"]
# The plausibility reviewer reads the study as a scholar of the texts would:
# whether the counts and topics say what the paper claims about the works.
plausibility_reviewer   = ["methods/text-analysis"]

# The machine-readable files the checks read.
[sidecars]
data_architect = ["corpus_design.json"]
data_analyst   = ["corpus_manifest.json"]

[[steps]]
kind    = "gate"
name    = "corpus_design_gate"
check   = "corpus_design"
on_fail = "retry"
after   = ["data_architect"]

[steps.settings]
min_seeds = 3

[[steps]]
kind  = "researcher"
name  = "review_design"
after = ["idea_developer", "literature_scanner", "data_architect"]
files = ["paper_plan.md", "literature_review.md", "corpus_design.json", "data_dictionary.json"]

[[steps]]
kind    = "gate"
name    = "corpus_gate"
check   = "corpus"
on_fail = "retry"
after   = ["data_analyst"]

[[steps]]
kind    = "gate"
name    = "text_results_gate"
check   = "text_results"
on_fail = "retry"
after   = ["econometrics_specialist"]

[steps.settings]
min_seeds    = 3
min_examples = 2

[[steps]]
kind    = "gate"
name    = "text_validation_gate"
check   = "text_validation"
on_fail = "retry"
after   = ["econometrics_specialist", "text_validator"]

[steps.settings]
min_validation_items = 20

[[steps]]
kind = "strategist"
name = "initial"

[[steps]]
kind  = "strategist"
name  = "iterative"
modes = ["iterative"]

[[steps]]
kind      = "gate"
name      = "estimation_gate"
check     = "estimation"
on_fail   = "halt"
resumable = false

[[steps]]
kind      = "gate"
name      = "figure_gate"
check     = "figure_data"
on_fail   = "halt"
resumable = false

[[steps]]
kind  = "researcher"
name  = "review_draft"
files = ["paper_draft.tex", "abstract.tex"]

[[steps]]
kind  = "specialists"
name  = "self_attack"
modes = ["iterative"]
run   = ["self_attacker"]

[[steps]]
kind     = "specialists"
name     = "polish"
modes    = ["iterative"]
parallel = true
run      = ["polish_numerics", "polish_bibliography"]

[[steps]]
kind     = "aggregate"
name     = "review"
parallel = true
run = [
    "methods_reviewer",
    "data_reviewer",
    "plausibility_reviewer",
    "writing_reviewer",
    "technical_reviewer",
]

[[steps]]
kind = "specialists"
name = "revision"
run  = ["revisor", "patch_revisor"]

[[steps]]
kind = "specialists"
name = "replication"
run  = ["replication_packager"]

