[[steps]]
kind  = "researcher"
name  = "review_design"
after = ["idea_developer", "literature_scanner", "data_architect", "data_analyst", "forecast_designer"]
files = ["paper_plan.md", "literature_review.md", "data_dictionary.json", "forecast_design.md", "forecast_design.json"]

[[steps]]
kind     = "preregister"
name     = "preregister"
optional = true
after    = ["idea_developer", "literature_scanner", "data_architect", "data_analyst", "forecast_designer"]
files    = ["paper_plan.md", "forecast_design.md", "forecast_design.json"]

# Inside the initial phase, after the forecast designer and before the analysis.
# On a failure the forecast designer is sent back once with the reasons.
[[steps]]
kind    = "gate"
name    = "forecast_design_gate"
check   = "forecast_design"
after   = ["data_analyst", "forecast_designer"]
on_fail = "retry"

[steps.settings]
min_train_periods = 24

[[steps]]
kind = "strategist"
name = "initial"

[[steps]]
kind  = "strategist"
name  = "iterative"
modes = ["iterative"]

[[steps]]
kind      = "gate"
name      = "estimation_gate"
check     = "estimation"
on_fail   = "halt"
resumable = false

[[steps]]
kind      = "gate"
name      = "forecast_gate"
check     = "forecast_evaluation"
on_fail   = "halt"
resumable = false

[[steps]]
kind      = "gate"
name      = "figure_gate"
check     = "figure_data"
on_fail   = "halt"
resumable = false

[[steps]]
kind  = "researcher"
name  = "review_draft"
files = ["paper_draft.tex", "abstract.tex"]

[[steps]]
kind  = "specialists"
name  = "self_attack"
modes = ["iterative"]
run   = ["self_attacker"]

[[steps]]
kind     = "specialists"
name     = "polish"
modes    = ["iterative"]
parallel = true
run      = ["polish_formula", "polish_numerics", "polish_bibliography"]

[[steps]]
kind     = "aggregate"
name     = "review"
parallel = true
run = [
    "methods_reviewer",
    "technical_reviewer",
    "data_reviewer",
    "plausibility_reviewer",
    "literature_reviewer",
    "writing_reviewer",
]

[[steps]]
kind = "specialists"
name = "revision"
run  = ["revisor", "patch_revisor"]

[[steps]]
kind = "specialists"
name = "replication"
run  = ["replication_packager"]
