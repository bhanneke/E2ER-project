# Time series and forecasting: a series in, its description, models and checked forecasts out.
#
# For studies of one series (or a few) over time: trend and seasonal pattern,
# stationarity, fitted models, forecasts with intervals, and their accuracy on
# periods the models never saw, compared with simple baselines. Typical of
# climate and hydrology records, energy and demand, epidemiological counts,
# prices and economic indicators.
#
# What the template changes about e2er's economics defaults
# (docs/templates.md): results are time-series models, forecasts and
# out-of-sample errors (results = "timeseries"), no causal claim, the researcher
# persona, no blockchain data skills, a panel of reviewers for any discipline,
# and polish of formulas, numbers and references.
#
# The order that keeps the evaluation honest:
#   review_design          the researcher reads the plan, the data and the
#                          forecast setup (forecast_design.json: series,
#                          hold-out, horizon, baselines, candidate models,
#                          diagnostics, interval level) before any model is fitted
#   preregister            OPTIONAL (choose it on New study, or
#                          `e2er run --review-at preregister`): the setup
#                          assembled into preregistration.md and frozen with its
#                          fingerprint on approval
#   forecast_design_gate   checks the setup against the series and freezes it
#                          with its hold-out (holdout_freeze.json); refuses a
#                          setup written after a model was fitted
#   estimation_gate        the results file held to the time-series contract
#   forecast_gate          diagnostics on training periods only, every model
#                          fitted before the hold-out and evaluated on exactly
#                          the hold-out, errors recomputed from the predictions,
#                          baselines present, forecasts with intervals
#                          (src/core/pipeline/forecast_checks.py)
#   figure_gate            every figure re-read from the data or results it names
#   review_draft           the researcher reads the draft before the reviewers
#
# The forecast designer is this template's own specialist. The method skill is
# methods/time-series-forecasting; the method sources are the [[credit]] entries.

name = "time-series-forecasting"
title = "Time series and forecasting"
description = "A series in, its trend, seasonality, models and forecasts out. The forecast setup and its hold-out are frozen before any model is fitted; every model is judged on the hold-out against naive baselines, with errors recomputed by e2er and forecasts given with intervals. Optional pre-registration of the setup."
methodologies = ["empirical", "time series"]

results     = "timeseries"
causal      = false
base_skill  = "base/researcher"
data_skills = []
review_weights = { methods_reviewer = 1.5, technical_reviewer = 1.25, data_reviewer = 1.0, plausibility_reviewer = 1.0, literature_reviewer = 0.75, writing_reviewer = 0.75 }

# Teardown, not a step (see empirical.toml).
finalize = ["compile", "audit_export", "github_push", "structured_export"]

[skills]
data_architect          = ["methods/time-series-forecasting"]
data_analyst            = ["methods/time-series-forecasting"]
econometrics_specialist = ["methods/time-series-forecasting"]
paper_drafter           = ["methods/time-series-forecasting"]
methods_reviewer        = ["methods/time-series-forecasting"]
technical_reviewer      = ["methods/time-series-forecasting"]

