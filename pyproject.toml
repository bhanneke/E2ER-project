[project]
name = "e2er"
version = "0.4.2"
description = "End-to-End Researcher — automated research pipeline for economics, finance, and IS"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "PyGithub>=2.4.0",
    "gitpython>=3.1.0",
    "pyalex>=0.14",
    "arxiv>=2.1.0",
    "bibtexparser>=2.0.0b7",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
pgvector = [
    "pgvector>=0.3.0",
    "sentence-transformers>=3.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[project.scripts]
e2er = "src.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Tell setuptools to package src/ (the codebase), skills/ (the skill
# markdown files), and sql/ (the SQLite bootstrap schema + Postgres
# migrations) into the wheel. `e2er install-skills` extracts the bundled
# skills to ~/.{claude,codex,gemini}/skills/ for the headless backends.
#
# Layout:
#   src/ → importable as `src.*` (src/api/, src/core/, src/db/, ...)
#   skills/ → top-level package; ships .md files as package-data so
#             `e2er install-skills` can find them via importlib.resources.
#   sql/ → top-level package; ships *.sql files. SQLite bootstrap in
#          src/db/client.py reads sql/sqlite/schema.sql via a relative
#          path resolution that works in both dev checkout and installed
#          wheel layouts.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "skills*", "sql*"]
exclude = ["tests*", "Tests*", "docs*", "examples*", "scripts*", "docker*"]

[tool.setuptools.package-data]
# Skill markdown files. `**` captures the category subdirs and the .md files.
"skills.files" = ["**/*.md"]
# Static assets and Jinja2 templates served by FastAPI. Without these the
# `app.mount("/static", StaticFiles(...))` call at import time crashes,
# which prevents uvicorn from starting on a fresh `pip install e2er`.
"src.api" = ["static/*", "templates/*"]
# SQLite bootstrap schema, loaded by src/db/client.py on first connect
# when DATABASE_URL is not set (zero-config user journey).
"sql.sqlite" = ["*.sql"]
# Postgres migrations (kept for `scripts/migrate.py` users who pip-install
# the dev extra or run from a source checkout).
"sql" = ["*.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N805/N806: first-arg / lowercase-variable rules don't fit our style.
ignore = ["N805", "N806"]

[tool.mypy]
python_version = "3.11"
# Pragmatic baseline: catch real bugs (wrong types, optional-attr access,
# variable shadowing) without grinding on annotation completeness for a
# 10K-line codebase that wasn't type-checked from day one.
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # tolerate # type: ignore drift across versions
strict_equality = true
# Disabled (would produce 30+ stylistic errors on the existing codebase):
#   disallow_untyped_defs / disallow_any_generics / no_any_return /
#   warn_return_any — these can be ratcheted on later, file-by-file, via
#   per-module overrides if you want to tighten gradually.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: real-LLM end-to-end tests (skipped unless ANTHROPIC_API_KEY is set)",
]
# Skip e2e by default; run explicitly with `-m e2e`.
addopts = "-m 'not e2e'"
