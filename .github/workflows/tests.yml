name: tests

on:
  push:
    branches: [main, dev, xplat]
  pull_request:

permissions:
  contents: read  # every job reads only; a job that writes says so itself

jobs:
  test:
    # Linux runs every supported Python; macOS and Windows run 3.12, so a reviewer on any of the three
    # gets a tested e2er (approved 2026-10-30). Lint and type checks run once, on Linux.
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt

      - name: Set up uv (the replay tests' `e2er reproduce` steps)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Install dependencies
        run: |
          # Every dependency pinned with its hashes (.github/requirements/ci.txt; docs/RELEASING.md
          # says how to refresh it), then e2er itself without dependencies or a build download.
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint (ruff check)
        if: runner.os == 'Linux'
        run: ruff check src/ tests/

      - name: Lint (ruff format)
        if: runner.os == 'Linux'
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        if: runner.os == 'Linux'
        run: mypy src/

      - name: Run tests
        env:
          # uv is installed above: the replay tests' reproduce steps fail instead of skipping (tests/replay/uv.py).
          E2ER_REQUIRE_UV: "1"
        run: pytest tests/ -v --tb=short -m "not e2e and not reviewer_path"

  package:
    # The wheel a user installs must be able to start a study. 0.11.0 shipped
    # without pipelines/, so every template name failed after `pip install e2er`
    # while every test above passed from the checkout. This job builds the
    # wheel, installs it into a fresh virtualenv outside the checkout and runs
    # scripts/check_wheel.sh: `e2er --help`, the four templates and the skill
    # files resolve, and `e2er verify` passes on a copy of examples/showcase.
    name: package (built wheel, clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/dist" .

      - name: Install it outside the checkout and check it
        run: PYTHON=python scripts/check_wheel.sh "$RUNNER_TEMP"/dist/e2er-*.whl

  reviewer-path:
    # What a reviewer does, on each system: the built wheel in a new virtual environment with an empty
    # home, then fetch, inspect, unpack, verify (also --against a local copy of e2er.org) and reproduce
    # (tests/test_reviewer_path.py, docs/REVIEWING.md). The test itself reaches nothing beyond this
    # computer: the dependencies are downloaded first, the sandbox's base image is pulled first.
    name: reviewer path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the test tools
        run: |
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Build the wheel
        run: python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/dist" .

      - name: Download e2er's dependencies for the new environment
        run: python -m pip download --require-hashes -r .github/requirements/ci.txt -d "$RUNNER_TEMP/wheelhouse"

      - name: Pull the sandbox's base image
        # GitHub's Linux runners have Docker with Linux containers: reproduce runs in the sandbox there.
        # macOS runners have no Docker, Windows runners only Windows containers: reproduce refuses there.
        if: runner.os == 'Linux'
        run: docker pull python:3.12-slim

      - name: The reviewer path
        env:
          E2ER_REQUIRE_REVIEWER_PATH: "1"
          E2ER_REVIEWER_WHEEL: ${{ runner.temp }}/dist
          E2ER_REVIEWER_WHEELHOUSE: ${{ runner.temp }}/wheelhouse
          E2ER_REVIEWER_REPRODUCE: ${{ runner.os == 'Linux' && 'sandbox' || 'refusal' }}
        run: pytest tests/test_reviewer_path.py -m reviewer_path -v --tb=short
