name: ci-data (Lane C)

# Lane C — Data Module (Allium clients, guardrails, audit, dictionary).
# Triggers ONLY when files relevant to the data lane change.

on:
  push:
    branches: [dev]
    paths:
      - 'src/modules/data/**'
      - 'scripts/e2er-allium-query'
      - 'tests/data/**'
      - 'tests/test_allium*.py'
      - 'tests/test_audit.py'
      - 'tests/test_guardrails.py'
      - 'skills/files/data/**'
      - '.github/workflows/ci-data.yml'
  pull_request:
    paths:
      - 'src/modules/data/**'
      - 'scripts/e2er-allium-query'
      - 'tests/data/**'
      - 'tests/test_allium*.py'
      - 'tests/test_audit.py'
      - 'tests/test_guardrails.py'
      - 'skills/files/data/**'
      - '.github/workflows/ci-data.yml'

permissions:
  contents: read  # every job reads only; a job that writes says so itself

jobs:
  lane-c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt

      - name: Install deps
        run: |
          # Every dependency pinned with its hashes (.github/requirements/ci.txt; docs/RELEASING.md
          # says how to refresh it), then e2er itself without dependencies or a build download.
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint changed files
        run: ruff check src/modules/data/

      - name: Run Lane C tests
        run: |
          pytest tests/ -v --tb=short -m "not e2e" \
            -k "allium or audit or guardrails"
