name: ci-data (Lane C)

# Lane C — Data Module (Allium clients, guardrails, audit, dictionary).
# Triggers ONLY when files relevant to the data lane change.

on:
  push:
    branches: [dev]
    paths:
      - 'src/modules/data/**'
      - 'scripts/e2er-allium-query'
      - 'tests/data/**'
      - 'tests/test_allium*.py'
      - 'tests/test_audit.py'
      - 'tests/test_guardrails.py'
      - 'skills/files/data/**'
      - '.github/workflows/ci-data.yml'
  pull_request:
    paths:
      - 'src/modules/data/**'
      - 'scripts/e2er-allium-query'
      - 'tests/data/**'
      - 'tests/test_allium*.py'
      - 'tests/test_audit.py'
      - 'tests/test_guardrails.py'
      - 'skills/files/data/**'
      - '.github/workflows/ci-data.yml'

jobs:
  lane-c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint changed files
        run: ruff check src/modules/data/

      - name: Run Lane C tests
        run: |
          pytest tests/ -v --tb=short -m "not e2e" \
            -k "allium or audit or guardrails"
