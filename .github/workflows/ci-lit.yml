name: ci-lit (Lane B)

# Lane B — Knowledge & Literature Ingestion (OpenAlex / S2 / arXiv / KB).
# Triggers ONLY when files relevant to the literature lane change.
#
# Lane B has no dedicated tests today. This workflow stays in place so the
# CI plumbing exists when Phase 2 adds tests/lit/contract/ tests, and so
# any future literature-only PR shows a "Lane B" check in the PR UI.

on:
  push:
    branches: [dev]
    paths:
      - 'src/modules/literature/**'
      - 'tests/lit/**'
      - 'tests/test_literature*.py'
      - 'skills/files/writing/**'
      - 'skills/files/synthesis/**'
      - '.github/workflows/ci-lit.yml'
  pull_request:
    paths:
      - 'src/modules/literature/**'
      - 'tests/lit/**'
      - 'tests/test_literature*.py'
      - 'skills/files/writing/**'
      - 'skills/files/synthesis/**'
      - '.github/workflows/ci-lit.yml'

permissions:
  contents: read  # every job reads only; a job that writes says so itself

jobs:
  lane-b:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt

      - name: Install deps
        run: |
          # Every dependency pinned with its hashes (.github/requirements/ci.txt; docs/RELEASING.md
          # says how to refresh it), then e2er itself without dependencies or a build download.
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint changed files
        run: |
          if [ -d "src/modules/literature" ]; then
            ruff check src/modules/literature/
          else
            echo "src/modules/literature does not exist yet — skipping lint"
          fi

      - name: Run Lane B tests
        # These used to be filtered with -k "literature" and swallowed with
        # `|| echo "passing trivially"`, so the lane was green whether or not
        # anything ran — and the filter matched none of the literature test
        # files, which are named for what they test rather than for the lane.
        # Named explicitly, and allowed to fail.
        run: |
          pytest tests/lit/ \
                 tests/test_structured_review.py \
                 tests/test_review_schema.py \
                 tests/test_extract_review.py \
                 tests/test_corpus.py \
                 tests/test_corpus_cli.py \
                 tests/test_corpus_context.py \
                 -v --tb=short -m "not e2e"
