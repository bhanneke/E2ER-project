name: ci-pipeline (Lane A)

# Lane A — Knowledge Production Pipeline.
# Triggers ONLY when files relevant to the pipeline lane change. This gives
# fast feedback on Lane A changes (~1 min) without waiting for full ci.yml.
#
# The full tests.yml runs on every dev/main merge as the "everything passes"
# gate; this workflow is the lane-specific fast lane.

on:
  push:
    branches: [dev]
    paths:
      - 'src/core/**'
      - 'src/modules/llm/**'
      - 'src/api/**'
      - 'src/skills/**'
      - 'skills/files/**'
      - 'tests/pipeline/**'
      - 'tests/test_pipeline*.py'
      - 'tests/test_api.py'
      - 'tests/test_methodology.py'
      - 'tests/test_review_aggregator.py'
      - 'tests/test_tool_loop_stress.py'
      - 'tests/test_first_run_guardrail.py'
      - 'tests/test_costs.py'
      - 'tests/test_security_review_fixes.py'
      - 'tests/test_regressions.py'
      - 'tests/test_claude_code_backend.py'
      - '.github/workflows/ci-pipeline.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/modules/llm/**'
      - 'src/api/**'
      - 'src/skills/**'
      - 'skills/files/**'
      - 'tests/pipeline/**'
      - 'tests/test_pipeline*.py'
      - 'tests/test_api.py'
      - 'tests/test_methodology.py'
      - 'tests/test_review_aggregator.py'
      - 'tests/test_tool_loop_stress.py'
      - 'tests/test_first_run_guardrail.py'
      - 'tests/test_costs.py'
      - 'tests/test_security_review_fixes.py'
      - 'tests/test_regressions.py'
      - 'tests/test_claude_code_backend.py'
      - '.github/workflows/ci-pipeline.yml'

jobs:
  lane-a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint changed files
        run: ruff check src/core/ src/modules/llm/ src/api/ src/skills/

      - name: Run Lane A tests
        # Until tests/ is reorganized into subdirs (Phase 2), keyword-match
        # the test files that exercise Lane A. The pattern below also picks
        # up tests/pipeline/** once it exists.
        run: |
          pytest tests/ -v --tb=short -m "not e2e" \
            -k "pipeline or api or methodology or review_aggregator or tool_loop or first_run or costs or security_review or regressions or claude_code"
