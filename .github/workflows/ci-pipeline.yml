name: ci-pipeline (Lane A)

# Lane A — Knowledge Production Pipeline.
# Triggers ONLY when files relevant to the pipeline lane change. This gives
# fast feedback on Lane A changes (~1 min) without waiting for full ci.yml.
#
# The full tests.yml runs on every dev/main merge as the "everything passes"
# gate; this workflow is the lane-specific fast lane.

on:
  push:
    branches: [dev]
    paths:
      - 'src/core/**'
      - 'src/modules/llm/**'
      - 'src/api/**'
      - 'src/skills/**'
      - 'skills/files/**'
      - 'tests/pipeline/**'
      - 'tests/test_pipeline*.py'
      - 'tests/test_api.py'
      - 'tests/test_methodology.py'
      - 'tests/test_review_aggregator.py'
      - 'tests/test_tool_loop_stress.py'
      - 'tests/test_first_run_guardrail.py'
      - 'tests/test_costs.py'
      - 'tests/test_security_review_fixes.py'
      - 'tests/test_regressions.py'
      - 'tests/test_claude_code_backend.py'
      - '.github/workflows/ci-pipeline.yml'
  pull_request:
    paths:
      - 'src/core/**'
      - 'src/modules/llm/**'
      - 'src/api/**'
      - 'src/skills/**'
      - 'skills/files/**'
      - 'tests/pipeline/**'
      - 'tests/test_pipeline*.py'
      - 'tests/test_api.py'
      - 'tests/test_methodology.py'
      - 'tests/test_review_aggregator.py'
      - 'tests/test_tool_loop_stress.py'
      - 'tests/test_first_run_guardrail.py'
      - 'tests/test_costs.py'
      - 'tests/test_security_review_fixes.py'
      - 'tests/test_regressions.py'
      - 'tests/test_claude_code_backend.py'
      - '.github/workflows/ci-pipeline.yml'

permissions:
  contents: read  # every job reads only; a job that writes says so itself

jobs:
  lane-a:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt

      - name: Install deps
        run: |
          # Every dependency pinned with its hashes (.github/requirements/ci.txt; docs/RELEASING.md
          # says how to refresh it), then e2er itself without dependencies or a build download.
          python -m pip install --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint changed files
        run: ruff check src/core/ src/modules/llm/ src/api/ src/skills/

      - name: Run Lane A tests
        # Until tests/ is reorganized into subdirs (Phase 2), keyword-match
        # the test files that exercise Lane A. The pattern below also picks
        # up tests/pipeline/** once it exists.
        run: |
          pytest tests/ -v --tb=short -m "not e2e" \
            -k "pipeline or api or methodology or review_aggregator or tool_loop or first_run or costs or security_review or regressions or claude_code"
